name: Deploy to MicroK8s

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  NAMESPACE: hv-portfolio
  APP_NAME: heidi-next-site
  DEPLOY_PATH: /home/github-actions/heidi-next-site
  REGISTRY: api.repoflow.io
  REPOFLOW_NAMESPACE: benguizat-5295/hv

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        run: |
          IMAGE_SHA="${{ env.REGISTRY }}/${{ env.REPOFLOW_NAMESPACE }}/${{ env.APP_NAME }}:${{ github.sha }}"
          IMAGE_LATEST="${{ env.REGISTRY }}/${{ env.REPOFLOW_NAMESPACE }}/${{ env.APP_NAME }}:latest"
          echo "image_sha=${IMAGE_SHA,,}" >> "$GITHUB_OUTPUT"
          echo "image_latest=${IMAGE_LATEST,,}" >> "$GITHUB_OUTPUT"

      - name: Login to Repoflow Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: hv-docker-image
          password: ${{ secrets.REPOFLOW_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image_sha }}
            ${{ steps.meta.outputs.image_latest }}

      - name: Upload k8s manifests to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.CLUSTER_IP }}
          username: github-actions
          key: ${{ secrets.CLUSTER_SSH_KEY }}
          source: "k8s/*"
          target: "${{ env.DEPLOY_PATH }}"
          overwrite: true
          strip_components: 1

      - name: Deploy on VPS with MicroK8s
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE: ${{ steps.meta.outputs.image_sha }}
          NAMESPACE: ${{ env.NAMESPACE }}
          APP_NAME: ${{ env.APP_NAME }}
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
          REGISTRY: ${{ env.REGISTRY }}
          NEXT_ADMIN_PASSWORD: ${{ secrets.NEXT_ADMIN_PASSWORD }}
          REPOFLOW_TOKEN: ${{ secrets.REPOFLOW_TOKEN }}
        with:
          host: ${{ vars.CLUSTER_IP }}
          username: github-actions
          key: ${{ secrets.CLUSTER_SSH_KEY }}
          envs: IMAGE,NAMESPACE,APP_NAME,DEPLOY_PATH,REGISTRY,NEXT_ADMIN_PASSWORD,REPOFLOW_TOKEN
          script: |
            set -euo pipefail

            KUBECTL="microk8s kubectl"

            # Namespace and manifests
            $KUBECTL apply -f "$DEPLOY_PATH/namespace.yaml"
            $KUBECTL apply -f "$DEPLOY_PATH/cluster-issuer.yaml"
            $KUBECTL -n "$NAMESPACE" apply -f "$DEPLOY_PATH/service.yaml"
            $KUBECTL -n "$NAMESPACE" apply -f "$DEPLOY_PATH/deployment.yaml"
            $KUBECTL -n "$NAMESPACE" apply -f "$DEPLOY_PATH/ingress.yaml"

            # App secret
            $KUBECTL -n "$NAMESPACE" create secret generic heidi-next-secret \
              --from-literal=NEXT_ADMIN_PASSWORD="$NEXT_ADMIN_PASSWORD" \
              --dry-run=client -o yaml | $KUBECTL apply -f -

            # Repoflow pull secret for the cluster
            $KUBECTL -n "$NAMESPACE" create secret docker-registry repoflow-creds \
              --docker-server="$REGISTRY" \
              --docker-username="hv-docker-image" \
              --docker-password="$REPOFLOW_TOKEN" \
              --dry-run=client -o yaml | $KUBECTL apply -f -

            # Roll to the new image
            $KUBECTL -n "$NAMESPACE" set image deployment/"$APP_NAME" app="$IMAGE"
            $KUBECTL -n "$NAMESPACE" rollout status deployment/"$APP_NAME" --timeout=180s
